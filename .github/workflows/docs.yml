name: Deploy Docs

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
  workflow_dispatch: { }

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (4.x docs)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout 3.x branch (3.x docs), if it exists
        id: checkout_3x
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: 3.x
          path: 3.x-src

      - name: Setup Ruby
        uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
          working-directory: 'main/docs'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # Published at the site root: symphony-bdk-java.finos.org/
      - name: Build 4.x docs with Jekyll
        working-directory: main/docs
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Published under /3.x/: symphony-bdk-java.finos.org/3.x/ — 3.x consumers must never land on 4.x
      # instructions, so this is a distinct subtree built from the 3.x branch's own docs/, not a copy.
      - name: Setup Ruby for 3.x docs
        if: steps.checkout_3x.outcome == 'success'
        uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
          working-directory: '3.x-src/docs'

      - name: Build 3.x docs with Jekyll
        if: steps.checkout_3x.outcome == 'success'
        working-directory: 3.x-src/docs
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}/3.x"
        env:
          JEKYLL_ENV: production

      - name: Merge 3.x docs into the published tree
        if: steps.checkout_3x.outcome == 'success'
        run: |
          mkdir -p main/docs/_site/3.x
          cp -r 3.x-src/docs/_site/. main/docs/_site/3.x/

      - name: Warn if 3.x branch is missing
        if: steps.checkout_3x.outcome != 'success'
        run: echo "::warning::'3.x' branch not found — publishing 4.x docs only, without a /3.x/ subtree."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "main/docs/_site/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
