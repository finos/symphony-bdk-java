plugins {
    id 'java-platform'
    id 'maven-publish'
    id 'signing'
}

description = 'Symphony Java BDK Bom (Bill Of Materials)'
// BDK 4.x requires Spring Boot 4.x. Spring Boot 3.x + BDK 4.x is not supported (D6 in
// openspec/changes/migrate-spring-boot-4/design.md) — consumers on Spring Boot 3 should stay on BDK 3.x.

javaPlatform {
    allowDependencies()
}

repositories {
    mavenCentral()
}

dependencies {
    // import Spring Boot's BOM
    api platform('org.springframework.boot:spring-boot-dependencies:4.0.7')
    // import Jackson 3's BOM. jackson-annotations has no 3.x release (JSTEP-1); the bom pins it at
    // the matching 2.x version under its legacy com.fasterxml.jackson.core coordinate (D2).
    api platform('tools.jackson:jackson-bom:3.2.1')
    // import Jersey's BOM
    api platform('org.glassfish.jersey:jersey-bom:4.0.0')
    // import Log4j's BOM
    api platform('org.apache.logging.log4j:log4j-bom:2.26.1')
    // Netty and Tomcat patch releases ahead of what spring-boot-dependencies:4.0.7 pins, for CVE fixes
    // on the same minor line (Netty 4.2.x, Tomcat 11.0.x) — reviewed as part of adopt-java-25-baseline.
    api platform('io.netty:netty-bom:4.2.16.Final')

    // define all our dependencies versions
    constraints {
        // Internal modules dependencies (Keep them first)
        api "org.finos.symphony.bdk:symphony-bdk-core:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-config:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-extension-api:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-http-api:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-http-jersey:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-http-webclient:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-core-spring-boot-starter:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-app-spring-boot-starter:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-template-api:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-template-freemarker:$project.version"
        api "org.finos.symphony.bdk:symphony-bdk-template-handlebars:$project.version"
        // extensions
        api "org.finos.symphony.bdk.ext:symphony-group-extension:$project.version"

        // External dependencies

        // Owned by this repo rather than inherited from spring-boot-dependencies: Lombok lags
        // JDK releases and is used in 13 modules, so its version needs to move independently
        // of the Spring Boot version.
        api 'org.projectlombok:lombok:1.18.46'

        api 'org.glassfish.jersey.connectors:jersey-apache5-connector:4.0.0'
        // CVE-2026-64607 (httpclient5) and CVE-2026-54399/CVE-2026-54428 (httpcore5) fixes, ahead of
        // what spring-boot-dependencies:4.0.7 pins (5.5.2 / 5.3.6)
        api 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
        api 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        api 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'

        api 'org.apiguardian:apiguardian-api:1.1.2'

        api 'org.slf4j:slf4j-api:2.0.9'
        api 'org.slf4j:slf4j-log4j12:2.0.9'

        api 'commons-io:commons-io:2.20.0'
        api 'commons-codec:commons-codec:1.19.0'
        api 'commons-beanutils:commons-beanutils:1.11.0'
        api 'org.apache.commons:commons-lang3:3.18.0'
        api 'org.apache.commons:commons-text:1.14.0'
        api 'commons-logging:commons-logging:1.3.5'
        api 'com.brsanthu:migbase64:2.2'
        api 'io.jsonwebtoken:jjwt-api:0.13.0'
        api 'io.jsonwebtoken:jjwt-impl:0.13.0'
        api 'org.bouncycastle:bcpkix-jdk18on:1.79'
        // Needed by openapi-generator's jersey2 library templates, which emit @javax.annotation.Nullable
        // on generated model getters/setters (symphony-bdk-core, symphony-group-extension) — confirmed by
        // inspecting generated sources, not by trusting the generator's changelog.
        api 'com.google.code.findbugs:jsr305:3.0.2'
        api 'org.jspecify:jspecify:1.0.0'

        api 'io.github.resilience4j:resilience4j-retry:2.3.0'

        api 'io.swagger:swagger-annotations:1.6.14'
        // 0.2.11+ is a multi-release jar with a Jackson 3 backend (JsonNullableJackson3Module),
        // auto-selected when tools.jackson.databind is on the classpath.
        api 'org.openapitools:jackson-databind-nullable:0.2.11'

        api 'org.freemarker:freemarker:2.3.33'
        api 'com.github.jknack:handlebars:4.5.1'
        api 'org.reflections:reflections:0.10.2'

        api 'info.picocli:picocli:4.7.6'

        api 'com.tngtech.archunit:archunit-junit5:1.5.0'
        api 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'
        api 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.24'
        api 'org.mock-server:mockserver-netty:7.5.0'
        api 'org.assertj:assertj-core:3.27.7'
    }
}

publishing {
    publications {
        bom(MavenPublication) {
            from components.javaPlatform
            pom(rootProject.ext.pomDefinition)
            pom {
                name = project.name
                description = project.description
            }
        }
    }

    repositories {
        maven {
            credentials {
                username = rootProject.ext.mavenRepoUsername
                password = rootProject.ext.mavenRepoPassword
            }
            url = rootProject.ext.mavenRepoUrl
        }
    }
}

signing {
    required = { rootProject.isReleaseVersion }
    sign publishing.publications.bom
}
