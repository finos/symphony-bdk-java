plugins {
    id 'bdk.java-library-conventions'
    id 'bdk.java-publish-conventions'
    id 'org.openapi.generator'
    id 'de.undercouch.download'
}

description = 'Symphony Java BDK Core'

javadoc {
    options.group 'Core - Configuration', 'com.symphony.bdk.core.config*'
    options.group 'Core - Authentication', 'com.symphony.bdk.core.auth*'
    options.group 'Core - Service', 'com.symphony.bdk.core.service*'
    options.group 'Core - Activity', 'com.symphony.bdk.core.activity*'
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
            element = 'CLASS'
            excludes = ['com.symphony.bdk.core.*.model.*', 'com.symphony.bdk.gen.api.*',]
        }
    }
}

dependencies {
    api project(':symphony-bdk-config')
    api project(':symphony-bdk-extension-api')
    api project(':symphony-bdk-http:symphony-bdk-http-api')
    api project(':symphony-bdk-template:symphony-bdk-template-api')

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'net.bytebuddy:byte-buddy:1.18.11'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    api 'org.apiguardian:apiguardian-api'
    implementation 'org.slf4j:slf4j-api'
    implementation 'commons-io:commons-io'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-text'
    implementation 'com.brsanthu:migbase64'
    implementation 'io.jsonwebtoken:jjwt-api'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl'
    implementation 'org.bouncycastle:bcpkix-jdk18on'
    api 'tools.jackson.core:jackson-databind'
    implementation 'io.github.resilience4j:resilience4j-retry'
    implementation 'io.swagger:swagger-annotations'
    // Generated model classes are annotated with @javax.annotation.Nullable by our custom pojo.mustache
    // template (JSR-305, never renamed to the jakarta namespace — unrelated to the jersey3/Jakarta EE move).
    implementation 'com.google.code.findbugs:jsr305'
    implementation 'org.jspecify:jspecify'
    // jersey3 forces useJakartaEe, so the generated @Generated annotation is jakarta.annotation.Generated.
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api'

    testImplementation project(':symphony-bdk-http:symphony-bdk-http-jersey')
    testRuntimeOnly project(':symphony-bdk-template:symphony-bdk-template-freemarker')

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.glassfish.jersey.core:jersey-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'com.tngtech.archunit:archunit-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'ch.qos.logback:logback-classic'
    testImplementation 'org.mock-server:mockserver-netty'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// OpenAPI code generation
def apiBaseUrl = "https://raw.githubusercontent.com/finos/symphony-api-spec/baf01bee3bd00612d57d2df481ea54aab9404017"
def generatedFolder = "${layout.buildDirectory.get()}/generated/openapi"
def apisToGenerate = [
        Agent: 'agent/agent-api-public-deprecated.yaml',
        Pod  : 'pod/pod-api-public-deprecated.yaml',
        Auth : 'authenticator/authenticator-api-public-deprecated.yaml',
        Login: 'login/login-api-public.yaml',
        Users: 'users/users-api-public.yaml'
]

sourceSets.main.java.srcDirs += "$generatedFolder/src/main/java"

apisToGenerate.each { api, path ->
    def downloadTask = tasks.register("download$api", Download) {
        src "$apiBaseUrl/$path"
        dest "${layout.buildDirectory.get()}/openapi/$api/${path.split("/")[1]}"
        overwrite false
        useETag  "all"
    }

    def generateTask = tasks.register("generate$api", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
        dependsOn downloadTask
        generatorName = 'java'
        library = 'jersey3'
        outputDir = generatedFolder
        inputSpec = "${layout.buildDirectory.get()}/openapi/$api/${path.split("/")[1]}"
        skipOverwrite = true
        generateApiTests = false
        generateModelTests = false
        generateModelDocumentation = false
        generateApiDocumentation = false
        apiPackage = 'com.symphony.bdk.gen.api'
        modelPackage = 'com.symphony.bdk.gen.api.model'
        invokerPackage = 'com.symphony.bdk.http.api'
        templateDir = "${rootDir}/templates"
        globalProperties = [
                models         : "",
                apis           : "",
                supportingFiles: "false"
        ]
        configOptions = [
                dateLibrary: "java8",
                sortParamsByRequiredFlag: "false"
        ]
        // AbstractJavaCodegen.processOpts() hardcodes JsonSerialize/JsonDeserialize/ToStringSerializer
        // as Jackson 2 databind imports (used for Set-typed properties) after any configured
        // importMapping override is applied, so the only way to redirect them is a post-generation
        // rewrite. BDK 4.x is Jackson 3 only (D2/task 6.7) — these must not reintroduce
        // jackson-databind 2 on the classpath.
        doLast {
            fileTree(generatedFolder) { include '**/*.java' }.each { javaFile ->
                def original = javaFile.text
                def rewritten = original
                        .replace('com.fasterxml.jackson.databind.annotation.JsonSerialize', 'tools.jackson.databind.annotation.JsonSerialize')
                        .replace('com.fasterxml.jackson.databind.annotation.JsonDeserialize', 'tools.jackson.databind.annotation.JsonDeserialize')
                        .replace('com.fasterxml.jackson.databind.ser.std.ToStringSerializer', 'tools.jackson.databind.ser.std.ToStringSerializer')
                if (rewritten != original) {
                    javaFile.text = rewritten
                }
            }
            // jersey3 forces useJakartaEe, so upstream imports must all resolve to the jakarta namespace.
            // pojo.mustache's own @javax.annotation.Nullable is a JSR-305 annotation, applied inline without
            // an import statement, so it never trips this check.
            def strayJavaxImports = fileTree(generatedFolder) { include '**/*.java' }.findAll { javaFile ->
                javaFile.text.readLines().any { it.startsWith('import javax.') }
            }
            if (!strayJavaxImports.isEmpty()) {
                throw new GradleException("Generated sources import javax.* even though library=jersey3 " +
                        "(useJakartaEe) is set — the Jakarta patch was lost in a template rebase: " +
                        strayJavaxImports.collect { it.path }.join(', '))
            }
        }
    }

    compileJava.dependsOn generateTask
    sourcesJar.dependsOn downloadTask
    sourcesJar.dependsOn generateTask
}

// Duplicated AuthRequest class, we need the one from auth API, so task order matters here
tasks.generateAuth.dependsOn tasks.generateLogin
// Duplicated SystemApi class, we need the one from agent API (contains v3Health/v3ExtendedHealth), so task order matters here
tasks.generatePod.dependsOn tasks.generateAgent
