plugins {
    id 'java'
    id 'jacoco'
    id "com.github.ben-manes.versions"
    id 'project-report'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

jacoco {
    toolVersion = '0.8.15'
}

jar {
    manifest {
        attributes("Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Automatic-Module-Name": project.name.replace("-", ".")
        )
    }
}

configurations {
    // Resolves the Mockito agent jar explicitly rather than relying on JVM self-attach, which the
    // JDK warns about and is scheduled to deny.
    mockitoAgent
}

test {
    useJUnitPlatform()
    doFirst {
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    }
}

dependencies {
    implementation platform(project(':symphony-bdk-bom'))
    annotationProcessor platform(project(':symphony-bdk-bom'))
    testAnnotationProcessor platform(project(':symphony-bdk-bom'))

    mockitoAgent platform(project(':symphony-bdk-bom'))
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

